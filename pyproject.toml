# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# Updated: 2026-08-18

[project]
name = "repo-census"
version = "0.1.0"
description = "Collect and preserve GitHub repository activity and traffic data."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
repo-census = "repo_census.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
